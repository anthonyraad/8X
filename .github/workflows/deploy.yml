name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy.yml'
      - '!docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::FIREBASE_OPTIONS_DART secret not set. Add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --base-href /8X/

      - name: Fix base href and asset paths for GitHub Pages
        run: |
          sed -i 's|<base href="[^"]*">|<base href="/8X/">|' build/web/index.html
          sed -i 's|src="flutter_bootstrap.js"|src="/8X/flutter_bootstrap.js"|g' build/web/index.html
          sed -i 's|href="favicon.png"|href="/8X/favicon.png"|g' build/web/index.html
          sed -i 's|href="manifest.json"|href="/8X/manifest.json"|g' build/web/index.html
          sed -i 's|href="icons/Icon-192.png"|href="/8X/icons/Icon-192.png"|g' build/web/index.html
          grep -E '<base href=|flutter_bootstrap|favicon|manifest' build/web/index.html

      - name: Deploy web build to repo root (GitHub Pages source)
        run: |
          cp build/web/index.html build/web/version.json build/web/main.dart.js build/web/manifest.json build/web/favicon.png .
          cp build/web/flutter.js build/web/flutter_bootstrap.js build/web/flutter_service_worker.js .
          rm -rf canvaskit icons
          cp -r build/web/canvaskit build/web/icons .
          cp build/web/assets/AssetManifest.* build/web/assets/FontManifest.json build/web/assets/NOTICES assets/
          rm -rf assets/assets assets/packages assets/shaders
          cp -r build/web/assets/assets build/web/assets/packages build/web/assets/shaders assets/
          find build/web/assets/fonts -maxdepth 1 -type f -exec cp {} assets/fonts/ \;
          cp -r build/web/* docs/
          touch .nojekyll docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html version.json main.dart.js manifest.json favicon.png flutter.js flutter_bootstrap.js flutter_service_worker.js canvaskit icons assets/AssetManifest.bin assets/AssetManifest.bin.json assets/AssetManifest.json assets/FontManifest.json assets/NOTICES assets/assets assets/fonts assets/packages assets/shaders docs/ .nojekyll
          git diff --staged --quiet && echo "No web changes to commit" || git commit -m "Deploy web build ${{ github.sha }}"
          git push
