name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy.yml'
      - '!docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --base-href /8x/

      - name: Fix base href and asset paths for GitHub Pages
        run: |
          # GitHub Pages uses lowercase repo name in URL: /8x/ not /8X/
          sed -i 's|<base href="[^"]*">|<base href="/8x/">|' build/web/index.html
          sed -i 's|src="flutter_bootstrap.js"|src="/8x/flutter_bootstrap.js"|g' build/web/index.html
          sed -i 's|href="favicon.png"|href="/8x/favicon.png"|g' build/web/index.html
          sed -i 's|href="manifest.json"|href="/8x/manifest.json"|g' build/web/index.html
          sed -i 's|href="icons/Icon-192.png"|href="/8x/icons/Icon-192.png"|g' build/web/index.html
          grep -E '<base href=|flutter_bootstrap|favicon|manifest' build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy web build ${{ github.sha }}
