name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href="/8X/"

      - name: Verify base href for GitHub Pages
        run: |
          if ! grep -q '<base href="/8X/">' build/web/index.html; then
            echo "::error::Expected <base href=\"/8X/\"> in build/web/index.html so assets resolve under /8X/"
            grep -n -E '<base href=|flutter_bootstrap' build/web/index.html || true
            exit 1
          fi
          grep -E '<base href=|flutter_bootstrap|favicon|manifest' build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
